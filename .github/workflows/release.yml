name: Release Olbyine Music

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '发布版本标签 (Release Tag, 例如: v1.0.0)'
        required: true
        default: 'v1.0.0'
      prerelease:
        description: '是否标记为预发布 (Pre-release)'
        type: boolean
        default: false
      draft:
        description: '是否保存为草稿 (Draft)'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'release-${{ github.ref }}'
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "TAG_NAME=${TAG}" >> $GITHUB_OUTPUT
          echo "Building version: ${TAG}"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Package Release Archives
        run: |
          VERSION="${{ steps.vars.outputs.TAG_NAME }}"
          cd dist
          zip -r "../olbyine-music-web-${VERSION}.zip" .
          tar -czvf "../olbyine-music-web-${VERSION}.tar.gz" .
          cd ..
          ls -lh olbyine-music-web-*

      - name: Create or Update Git Tag (if manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -fa "${{ steps.vars.outputs.TAG_NAME }}" -m "Release ${{ steps.vars.outputs.TAG_NAME }}"
          git push origin "${{ steps.vars.outputs.TAG_NAME }}" --force || echo "Tag already pushed or remote permission bypassed"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.TAG_NAME }}
          name: "Olbyine Music ${{ steps.vars.outputs.TAG_NAME }}"
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            olbyine-music-web-${{ steps.vars.outputs.TAG_NAME }}.zip
            olbyine-music-web-${{ steps.vars.outputs.TAG_NAME }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build for Pages
        run: npm run build
        env:
          VITE_BASE_PATH: './'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
